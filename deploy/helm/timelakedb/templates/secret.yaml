{{- if include "timelakedb.hasChartSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "timelakedb.fullname" . }}
  labels:
    {{- include "timelakedb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.objectStore.enabled .Values.objectStore.accessKeyId (not .Values.objectStore.existingSecret) }}
  AWS_ACCESS_KEY_ID: {{ .Values.objectStore.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretAccessKey | quote }}
  {{- end }}
  {{- if and .Values.encryption.key (not .Values.encryption.existingSecret) }}
  TIMELAKE_ENCRYPTION_KEY: {{ .Values.encryption.key | quote }}
  {{- end }}
  {{- with .Values.adminBootstrapPassword }}
  TIMELAKE_ADMIN_BOOTSTRAP_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
