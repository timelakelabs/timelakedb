{{- if eq .Values.mode "cluster" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timelakedb.fullname" . }}-ingester
  labels:
    {{- include "timelakedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
spec:
  # Headless: governs the ingester StatefulSet's stable identity. It carries the
  # intra-cluster listener (1965), which is NEVER on an externally-typed Service
  # — peers reach it by pod IP (Consul-advertised) over the cluster network only.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "timelakedb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
    - name: cluster
      port: 1965
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "timelakedb.fullname" . }}-ingester
  labels:
    {{- include "timelakedb.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingester
spec:
  serviceName: {{ include "timelakedb.fullname" . }}-ingester
  replicas: {{ .Values.cluster.ingester.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "timelakedb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingester
  template:
    metadata:
      labels:
        {{- include "timelakedb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingester
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "timelakedb.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "timelakedb.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "timelakedb.waitConsulInit" . | nindent 8 }}
        {{- include "timelakedb.ensureBucketInit" . | nindent 8 }}
      containers:
        - name: timelakedb
          image: {{ include "timelakedb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "timelakedb.clusterEnvFrom" . | nindent 12 }}
          env:
            {{- include "timelakedb.podIdentityEnv" . | nindent 12 }}
            - name: TIMELAKE_ROLE
              value: ingester
            - name: TIMELAKE_CLUSTER_ADDR
              value: "$(POD_IP):1965"
            {{- include "timelakedb.tlsEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: flight
              containerPort: {{ .Values.service.flightPort }}
            - name: cluster
              containerPort: 1965
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "timelakedb.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/timelake/data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/timelake/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.cluster.ingester.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cluster.ingester.persistence.size }}
{{- end }}
