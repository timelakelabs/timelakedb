# AT-7 write load: the same stock Telegraf as AT-6, but over TLS — the
# influxdb_v2 output's standard tls_ca option pointed at the drill CA.
# Aggressive flushing so a dropped connection during rotation would be
# visible immediately as output errors.
[agent]
  interval = "1s"
  flush_interval = "1s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]

[[outputs.influxdb_v2]]
  urls = ["https://timelakedb-tls:1963"]
  token = "anything-auth-is-off"
  organization = "poc"
  bucket = "poc"
  tls_ca = "/certs/ca.crt"
