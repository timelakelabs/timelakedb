# AT-6 write half: a STOCK Telegraf agent, unmodified plugins, writing to
# TimeLakeDB through the influxdb_v2 output (gzip content-encoding is the
# plugin default — exactly the FR-9 contract).
[agent]
  interval = "5s"
  flush_interval = "5s"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]

[[outputs.influxdb_v2]]
  urls = ["http://timelakedb:1963"]
  # Empty on purpose. The node ships TIMELAKE_DATA_AUTH=optional (#162):
  # no token is served anonymously, a WRONG token is refused with 401. This
  # used to say "anything-auth-is-off", which stopped being a joke the day
  # the default moved. To authenticate, issue a write-scoped token from the
  # console and put it here.
  token = ""
  organization = "poc"
  bucket = "poc"
