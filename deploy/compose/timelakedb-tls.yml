# AT-7 drill stack: TimeLakeDB with TLS 1.3 on both listeners (SEC-3),
# plus stock Telegraf writing over HTTPS. Separate ports and volume so
# the plaintext bench fixture can keep running untouched.
#
#   cd deploy/compose/tls-drill && sh gen-certs.sh initial && cd ..
#   docker compose -f compose/timelakedb-tls.yml --profile telegraf up -d --build
#   python compose/tls-drill/at7_drill.py
name: bench-timelakedb-tls
services:
  timelakedb-tls:
    build: ../..
    container_name: timelakedb-tls
    ports:
      - "2963:1963"   # HTTPS: line-protocol writes + /api/sql
      - "2964:1964"   # Flight SQL over TLS
      - "2966:1966"   # HTTPS: private admin listener (console + /admin/*)
    environment:
      TIMELAKE_TLS_CERT: /certs/server.crt
      TIMELAKE_TLS_KEY: /certs/server.key
      # U0a moved /admin/* off the data port onto the private admin
      # listener; 1963 answers them with 410 now. The listener defaults to
      # 127.0.0.1:1966 — loopback INSIDE the container, which a published
      # port cannot reach — so bind every interface to make 2966 above
      # answer. AT-7's drill and Catchment's cert-rotation both drive
      # /admin/tls/reload through it.
      TIMELAKE_ADMIN_ADDR: 0.0.0.0:1966
      # SEC-3 want mode: a client MAY present a certificate and will be
      # identified if it does; one that does not is still served, which
      # is what keeps Grafana and Telegraf working unchanged.
      TIMELAKE_TLS_CLIENT_CA: /certs/ca.crt
    volumes:
      - timelake-tls-data:/var/lib/timelake/data
      # bind mount, read-only: the drill rotates certs by overwriting
      # these files from the host, exactly like a certbot renewal would.
      - ./tls-drill/certs:/certs:ro
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:1963/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # AT-6 read half over TLS, deliberately WITHOUT a client certificate:
  # the server requests one, Grafana has none, and the dashboards must
  # render anyway. If this service ever needs a cert to work, want mode
  # has regressed into required mode.
  #   docker compose -f compose/timelakedb-tls.yml --profile grafana up -d
  grafana:
    image: grafana/grafana:latest
    container_name: timelake-grafana-tls
    profiles: ["grafana"]
    ports:
      - "3006:3000"   # was 3004 — the console rig's Grafana (#42); at6_grafana_mtls.py follows
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana-datasource-tls:/etc/grafana/provisioning/datasources:ro
      - ../../fixtures/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../fixtures/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./tls-drill/certs:/certs:ro
    restart: unless-stopped
    depends_on:
      - timelakedb-tls

  telegraf:
    image: telegraf:latest
    container_name: timelake-telegraf-tls
    profiles: ["telegraf"]
    volumes:
      - ./telegraf-tls.conf:/etc/telegraf/telegraf.conf:ro
      - ./tls-drill/certs:/certs:ro
    restart: unless-stopped
    depends_on:
      - timelakedb-tls

volumes:
  timelake-tls-data:
