name: ci

# Markdown does not gate this workflow. The work here is expensive — clippy, the
# workspace tests, a Docker image and tier-1 conformance, plus an instrumented
# coverage rebuild on a push to main — billed private-repo minutes
# (Catchment/CI.md treats that budget as a real constraint) — and none of it can
# be affected by a prose change: no Rust source pulls a .md in via include_str!,
# and no test opens one. The .md references in crates/ are doc comments and error
# strings citing SECURITY.md, not reads.
#
# Shape: a cheap `lint` job (fmt + clippy) gates the expensive ones, so a
# formatting or clippy slip does not also pay for conformance and coverage on a
# commit that cannot merge. Coverage runs only on main; a pull request runs a
# plain `cargo test`. Both keep the billed minutes off doomed and off routine
# pull-request runs.
#
# The cost is that a docs-only commit gets no run, so its sha has no green
# result of its own. That is the intended trade: the last green run still
# describes the last commit that could have changed behaviour, which is what
# the evidence in docs/evidence/P0-1-ci.md is actually claiming.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

# Without this, a second push during a 20-minute Rust build queues a
# whole second build rather than replacing the first. On a private repo
# that is billed minutes spent on a commit nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The cheap gate: fmt + clippy, ~3 min. Everything expensive below
  # `needs: [lint]`, so a formatting or clippy slip fails here instead of ALSO
  # burning a ~22 min conformance run and an instrumented coverage rebuild on a
  # commit that was never going to merge. Not hypothetical: the #80 DDL PRs went
  # red on `cargo fmt --check` while conformance ran green in parallel, three
  # times, each ~22 wasted minutes on a private-repo bill.
  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Tests always; coverage only on a push to main. The instrumented
  # `cargo llvm-cov` rebuild is both the expensive half and the only part that
  # needs the disk-reclaim dance, and it does not need to gate every pull
  # request: a PR runs a plain `cargo test`, main measures coverage. Each event
  # therefore runs the workspace suite exactly once — plain on a PR (`on.push`
  # is main/master only), instrumented on main.
  test:
    name: tests · coverage
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A 16-crate workspace rebuilt instrumented for coverage does not fit on a
      # hosted runner beside its preinstalled images: run 31561992129 reached
      # 87 MB free and `ld` died with SIGBUS mid-link. That reads as a test
      # failure in the log and is not one — the same sha passes in a stock
      # rust:1-slim container. None of what is removed is used here, and the
      # plain `cargo test` on a PR fits without it, so this runs only for the
      # coverage build on main.
      - name: Reclaim runner disk
        if: github.event_name == 'push'
        run: |
          echo "before: $(df -h --output=avail / | tail -1) available"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /usr/local/graalvm \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/share/chromium
          sudo docker image prune -af || true
          echo "after:  $(df -h --output=avail / | tail -1) available"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Pull request: a plain test run, no instrumentation, no disk dance.
      - name: Tests
        if: github.event_name == 'pull_request'
        run: cargo test --workspace

      # main: the same suite, instrumented, with the 80% line gate.
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: github.event_name == 'push'
      # Two exclusions, both because the code is exercised somewhere this
      # job is not, rather than because it is untested:
      #   main.rs   — socket bind/serve, covered by the container healthcheck.
      #   store-s3  — S3Store/AwsKms need a live S3 and KMS, so their tests
      #               are #[ignore]d. They are no longer a hole: the
      #               `store-s3` job below runs them for real against a
      #               LocalStack service container on every push, so the
      #               exclusion now means "counted in another job", not
      #               "not counted". Measured 2026-08-09: 7.7% here, 82.4%
      #               workspace-wide once excluded, against 76.7% with it
      #               counted — i.e. this gate would have failed for a file
      #               whose tests all pass elsewhere.
      #
      # Strip full DWARF from the instrumented rebuild. The plain `cargo test`
      # fits; this coverage build does not, and freeing more runner disk
      # (above) was a losing race against a workspace that only grows —
      # datafusion + arrow + aws-sdk instrumented AND carrying `-C debuginfo=2`
      # produced object files that OOM'd `ld` mid-link (SIGBUS, "ld terminated
      # with signal 7", on whichever test binary drew the short straw).
      # llvm-cov's line counts come from the embedded coverage map, not from
      # DWARF, so line-tables-only is all it needs and cuts the link 3–5×.
      # `--fail-under-lines` is unaffected.
      - name: Coverage
        if: github.event_name == 'push'
        run: cargo llvm-cov --workspace --ignore-filename-regex 'main\.rs|store-s3/src/lib\.rs' --fail-under-lines 80
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only

  store-s3:
    name: store-s3 · S3 + KMS against LocalStack
    needs: [lint]
    runs-on: ubuntu-latest
    # The three #[ignore]d tests in timelake-store-s3 are the only ones that
    # touch a real object store: the Store contract over S3 (including range
    # reads), the KMS envelope round-trip, and the P0-4 two-writer catalog
    # CAS drill over S3's If-None-Match. They are the reason the CAS claim is
    # about S3 semantics and not just a local hard-link emulation, so they
    # belong in CI even though they need a service.
    services:
      localstack:
        # Pinned: 4.9 is the last community line carrying s3 + kms and the
        # conditional-write support the CAS test depends on.
        image: localstack/localstack:4.9
        env:
          SERVICES: s3,kms
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TLDB_S3_TEST_BUCKET: timelake-it
      TLDB_KMS_TEST_KEY: alias/timelake
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Polled from a step rather than declared as a container health check:
      # this does not assume what is installed inside the image, and a
      # failure here is legible in the log instead of a silent "unhealthy".
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do
            if curl -fs "$AWS_ENDPOINT_URL/_localstack/health" >/dev/null; then
              echo "LocalStack ready after $((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "LocalStack never became healthy"; exit 1
      - name: Create the test bucket and KMS alias
        run: |
          aws --endpoint-url="$AWS_ENDPOINT_URL" s3api create-bucket --bucket "$TLDB_S3_TEST_BUCKET"
          key=$(aws --endpoint-url="$AWS_ENDPOINT_URL" kms create-key \
                  --description "timelake CI envelope key" \
                  --query KeyMetadata.KeyId --output text)
          aws --endpoint-url="$AWS_ENDPOINT_URL" kms create-alias \
                  --alias-name "$TLDB_KMS_TEST_KEY" --target-key-id "$key"
      - run: cargo test -p timelake-store-s3 -- --ignored

  conformance:
    name: catchment · conformance (tier 1)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default GITHUB_TOKEN is scoped to this repository, so it
      # cannot read a private Catchment. A GitHub App installation token
      # can, is short-lived, and is not tied to anyone's account. One-time
      # setup is in Catchment/CI.md.
      - name: Mint a cross-repo token
        uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Catchment
          token: ${{ steps.app.outputs.token }}
          path: .catchment

      # Tier 1 includes scenarios that feed the database through Tributary,
      # so the suite needs Tributary's corpus generator on disk — not just
      # TimeLakeDB. Without it `catchment doctor` reports the prerequisite
      # MISSING and exits 2, and because the step runs under `bash -e` the
      # `ci` line never executes at all: the job fails having tested nothing.
      # Catchment's own workflow has always checked out both products; this
      # one had not, which is why that job went green and this one did not.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Tributary
          token: ${{ steps.app.outputs.token }}
          path: .tributary

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@v3

      # Built from THIS checkout, never a published tag: the point of the
      # job is to gate the tree in the pull request. Tagged with the name
      # compose would have chosen (<project>-<service>) so the run below
      # can reuse it with --no-build instead of compiling twice.
      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bench-timelakedb-timelakedb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Tributary agent, which tier 1 has driven as a container since
      # Catchment C1. A fixture here, not the thing under test — but it
      # must exist before `up`, or compose builds it cold and uncached
      # inside the stack's bring-up timeout. Scoped cache: the two
      # TimeLakeDB builds in this file share the default scope on
      # purpose (same context, shared layers); this one would evict them.
      - name: Build the Tributary agent
        uses: docker/build-push-action@v6
        with:
          context: .tributary
          load: true
          tags: bench-timelakedb-tributary:latest
          cache-from: type=gha,scope=tributary
          cache-to: type=gha,scope=tributary,mode=max

      # Tier 1 only. Clustered scenarios are nightly in Catchment's own
      # repo; making every push wait for a five-node cluster is how a
      # conformance gate gets switched off.
      - name: Conformance
        working-directory: .catchment
        env:
          CATCHMENT_TIMELAKE_DIR: ${{ github.workspace }}
          CATCHMENT_TRIBUTARY_DIR: ${{ github.workspace }}/.tributary
        run: |
          python -m catchment doctor
          python -m catchment ci --tier 1 --up --no-build

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ github.run_id }}
          path: .catchment/results/
          retention-days: 30

  publish:
    name: publish · ghcr image for downstream conformance
    runs-on: ubuntu-latest
    # Only from the default branch, and only once every gate is green.
    # Tributary's conformance job consumes this image rather than
    # compiling the database on every one of its pull requests — the one
    # deliberate exception to "test the working tree, never a published
    # tag", justified because there the tree under test is Tributary's.
    needs: [test, store-s3, conformance]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Private packages are not readable by another private repo by
      # default. Grant it once: package settings -> Manage Actions access
      # -> add the Tributary repository with Read.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timelakedb:main
            ghcr.io/${{ github.repository_owner }}/timelakedb:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
