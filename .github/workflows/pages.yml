name: pages

# Publishes site/ as a GitHub Pages project site. Enable once per repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Pages is not available on a private repository under the Free
    # plan, so on one this job would fail on every push that touches site/ —
    # a permanently red badge caused by the repo's visibility rather than by
    # anything wrong with the site. Skip instead, and start publishing by
    # itself the moment the repository becomes public.
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
