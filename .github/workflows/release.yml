# Release: build the Linux packages for a tag and attach them to the Release.
#
# Triggered by a version tag, never by a push to a branch. `ci.yml` proves the
# tree; this workflow's job is only to turn a proven tree into artifacts
# somebody can install, so it deliberately does NOT re-run the test suite —
# the tag is expected to point at a commit whose `ci.yml` run was green, and
# duplicating 30 minutes of billed private-repo minutes per tag would make
# cutting a release something people avoid doing.
#
# What it produces, attached to the GitHub Release:
#   timelakedb_<version>_amd64.deb     apt / dpkg
#   timelakedb-<version>.x86_64.rpm    dnf / yum / rpm
#   SHA256SUMS
#
# The build itself is `packaging/build.sh`, which runs entirely in containers.
# The runner therefore needs Docker and nothing else — no Rust toolchain, no
# nfpm, no rpmbuild — and a laptop reproduces the artifact byte-for-byte with
# the same command. It also means the glibc floor is a property of the build
# image (Debian 11, glibc 2.31), not of whatever the hosted runner happens to
# ship this month; see the comment at the top of build.sh for why that
# matters.

name: release

on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be re-run, or a package be built off a branch for
  # inspection, without cutting a tag to find out.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0-alpha). Defaults to the latest tag.'
        required: false
        type: string

# A release must never be cancelled by a later push. Grouped per ref so two
# tags can build at once, but neither interrupts the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  packages:
    name: build · deb + rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh derives the version from `git describe`, which needs the
          # tags — a shallow clone has none of them.
          fetch-depth: 0

      - name: Build packages
        run: |
          chmod +x packaging/build.sh
          packaging/build.sh ${{ inputs.version }}

      # Installing the artifact is the only check that matters here, and it is
      # cheap: four containers, no compilation. A package that builds but will
      # not install is exactly the failure a release pipeline exists to catch
      # before a user does, and the two formats fail differently.
      #
      # This runs the same script a developer runs locally, against the same
      # four distros. On its first execution it caught an `apt remove` that
      # deleted the data directory and a scriptlet that failed every install
      # on Amazon Linux 2023 — neither of which is visible from the spec.
      - name: Verify the packages install and run
        run: |
          chmod +x packaging/verify.sh
          packaging/verify.sh

      - name: Attach to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          # A tag ending in a pre-release identifier is marked as such, so
          # `v0.1.0-alpha` does not present itself as the stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Kept for a workflow_dispatch run, where there is no Release to attach
      # to and the artifacts would otherwise be discarded with the runner.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: timelakedb-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          retention-days: 14

  # The image somebody actually rolls back to. `ci.yml` publishes `:main` and
  # `:<sha>` for Tributary's conformance job to consume; neither is a release.
  # `:main` moves, and nobody writes a sha down, so "run what we ran last
  # week" had no answer.
  #
  # arm64 is built HERE and not in `ci.yml` on purpose. It comes from QEMU
  # emulation, which turns a Rust release build into roughly three times the
  # pipeline, and paying that once per tag is reasonable where paying it on
  # every push is how a build gate gets deleted.
  image:
    name: publish · multi-arch image
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow's, they do not merge with
    # them, so `contents: read` has to be spelled out next to `packages`.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # v0.5.0 -> 0.5.0. The image tag carries no `v`, matching the packages
      # and the chart, so one version string names all three artifacts.
      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          raw='${{ inputs.version }}'
          if [ -z "$raw" ]; then raw='${{ github.ref_name }}'; fi
          version=${raw#v}
          if [ -z "$version" ]; then
            echo "no version: not a tag and no workflow_dispatch input" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # The full tag list is built here rather than inline in the build
          # step, because the conditional `latest` has to be able to produce
          # NOTHING — an inline `|| ''` leaves a blank line in a multi-line
          # tag list and what that means is up to the action.
          img=ghcr.io/${{ github.repository_owner }}/timelakedb
          tags="$img:$version"
          case "$version" in
            *-*) : ;;                      # a pre-release never takes `latest`
            *)   tags="$tags,$img:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "building $version" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only for a real release. A pre-release tag that claimed
      # `latest` would be handed to everyone who typed the image name with no
      # tag at all, which is the one group least equipped to notice.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          # Attestations off: buildx otherwise adds `unknown/unknown` entries
          # to the manifest list, which is harmless but makes the thing an
          # operator inspects during an incident harder to read for no gain
          # here.
          provenance: false
          tags: ${{ steps.v.outputs.tags }}
          cache-from: type=gha

      # The manifest is the deliverable, so it gets checked rather than
      # assumed. A single-arch push still succeeds and still tags; the only
      # thing that tells them apart is asking what is in it.
      - name: The manifest really is multi-arch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref=ghcr.io/${{ github.repository_owner }}/timelakedb:${{ steps.v.outputs.version }}
          docker buildx imagetools inspect "$ref" | tee /tmp/manifest.txt
          for want in linux/amd64 linux/arm64; do
            grep -q "$want" /tmp/manifest.txt \
              || { echo "$ref is missing $want" >&2; exit 1; }
          done
          { echo '### image'; echo '```'; cat /tmp/manifest.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  # The chart is published only after the image it names exists. A chart whose
  # appVersion points at a tag nobody pushed installs cleanly and then sits in
  # ImagePullBackOff, which costs an afternoon to diagnose the first time.
  chart:
    name: publish · helm chart
    runs-on: ubuntu-latest
    needs: [image, packages]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `latest`. This is the version the chart is verified
      # against, the way ALERTING.md pins the Grafana it was drilled on: a
      # silent helm upgrade changing render or lint behaviour should be a
      # deliberate bump with a re-check, not a Tuesday morning surprise.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          raw='${{ inputs.version }}'
          if [ -z "$raw" ]; then raw='${{ github.ref_name }}'; fi
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      # Stamped here rather than committed. The chart in the tree tracks
      # `main` because that is what a developer running `helm install` off a
      # checkout should get; the ARTIFACT is what has to name a real release,
      # and a version somebody remembers to bump by hand is a version that
      # eventually does not get bumped.
      - name: Stamp the chart at the tag
        run: |
          set -euo pipefail
          v='${{ steps.v.outputs.version }}'
          sed -i "s|^version: .*|version: $v|" deploy/helm/timelakedb/Chart.yaml
          sed -i "s|^appVersion: .*|appVersion: \"$v\"|" deploy/helm/timelakedb/Chart.yaml
          helm lint deploy/helm/timelakedb
          grep -E '^(version|appVersion):' deploy/helm/timelakedb/Chart.yaml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Package and push
        run: |
          set -euo pipefail
          helm package deploy/helm/timelakedb --destination dist/
          if [ '${{ github.event_name }}' = 'push' ]; then
            echo '${{ secrets.GITHUB_TOKEN }}' \
              | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
            helm push dist/timelakedb-*.tgz \
              oci://ghcr.io/${{ github.repository_owner }}/charts
          fi

      # Also on the Release. An OCI registry is the good path; a tarball on
      # the release page is the one that works from a network that cannot
      # reach ghcr.
      - name: Attach the chart to the Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/timelakedb-*.tgz
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
