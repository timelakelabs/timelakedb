[package]
name = "timelake-flight"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow = "59"
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"
futures = "0.3"
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true }
rustls.workspace = true
tokio-rustls.workspace = true
timelake-auth = { path = "../auth" }
timelake-ingest = { path = "../ingest" }
timelake-tls = { path = "../tls" }

[dev-dependencies]
# already in the tree via tonic; the tests need TcpListenerStream so the
# server can bind an ephemeral port
tokio-stream = { version = "0.1", features = ["net"] }
