[package]
name = "timelake-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
timelake-api = { path = "../api" }
timelake-auth = { path = "../auth" }
timelake-audit = { path = "../audit" }
timelake-cluster = { path = "../cluster" }
timelake-ingest = { path = "../ingest" }
timelake-wal = { path = "../wal" }
timelake-buffer = { path = "../buffer" }
timelake-query = { path = "../query" }
timelake-store = { path = "../store" }
timelake-store-s3 = { path = "../store-s3" }
timelake-catalog = { path = "../catalog" }
timelake-compact = { path = "../compact" }
timelake-flight = { path = "../flight" }
timelake-tls = { path = "../tls" }
timelake-config = { path = "../config" }
arc-swap.workspace = true
axum-server.workspace = true
# HTTP peer identity: the acceptor reads the rustls ServerConnection off the
# stream, and layers the identity onto the service. Both crates are already
# compiled in via axum-server/reqwest; these are direct declarations of what
# is there, not new dependencies.
tokio-rustls.workspace = true
tower-layer = "0.3"
reqwest.workspace = true
flate2.workspace = true

[dev-dependencies]
# CL-3 tests wire two engines to ONE store in a single process — the
# cluster's read shape without a container.
timelake-store = { path = "../store" }
timelake-prometheus = { path = "../prometheus" }
prost = "0.14"
snap = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile.workspace = true



