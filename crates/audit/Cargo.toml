[package]
name = "timelake-audit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Only for the one event this crate cannot refuse and cannot silently drop:
# a best-effort append that failed. The count alone does not say what went
# missing (#163).
tracing = { workspace = true }
# Same SHA-256 the auth crate already uses for token digests — no new
# supply-chain surface (see crates/auth).
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
