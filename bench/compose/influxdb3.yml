# InfluxDB 3 Core target for tsdb-bench — the baseline TimelordDB must beat
# (recorded baseline runs live in ../results/influxdb3-idb3-full-*).
#   docker compose -f compose/influxdb3.yml up -d
#   python bench.py run --backend influxdb3 --scale smoke --label idb3-smoke
name: bench-influxdb3
services:
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --without-auth
    ports:
      - "8181:8181"
    volumes:
      - ./data/influxdb3:/var/lib/influxdb3/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
