# VictoriaMetrics target for tsdb-bench.
#   docker compose -f compose/victoriametrics.yml up -d
#   python bench.py run --backend victoriametrics --scale smoke --label vm-smoke
#
# The -search.max* limits are raised well above defaults on purpose: the
# whole point is to genuinely attempt the ~1-2M-unique-product_id funnel
# rather than fail fast on a query guardrail. Memory behavior under that
# load is the finding being collected.
name: bench-victoriametrics
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    command:
      - "-retentionPeriod=1y"
      - "-search.maxQueryDuration=300s"
      - "-search.maxUniqueTimeseries=50000000"
      - "-search.maxSamplesPerQuery=2000000000"
      - "-search.maxSeries=50000000"
    ports:
      - "8428:8428"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data
    restart: unless-stopped
