[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "A time-series database for high-cardinality event analytics, specified from a five-engine benchmark."
repository = "https://github.com/timelakelabs/timelakedb"
homepage = "https://github.com/timelakelabs/timelakedb"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
datafusion = "55"
flate2 = "1"
tempfile = "3"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
arc-swap = "1"
x509-parser = "0.17"
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Intra-cluster HTTP client (CL-2 WAL replication). rustls, no OpenSSL,
# matching the rest of the tree; the `blocking` client is called from the
# sync write path (which already runs under spawn_blocking).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }



