apiVersion: 1

datasources:
  - name: InfluxDB3-SQL
    uid: influxdb3
    type: influxdb
    access: proxy
    url: http://influxdb3:8181
    isDefault: true
    jsonData:
      version: SQL
      dbName: $INFLUX_DB
      httpMode: POST
      # SQL uses Flight SQL (gRPC). No TLS in this PoC stack, so:
      insecureGrpc: true
    secureJsonData:
      # Ignored while the server runs --without-auth; set INFLUX_TOKEN in .env
      # if you enable authentication.
      token: $INFLUX_TOKEN
    editable: true
